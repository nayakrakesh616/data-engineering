name: Sync LeetCode Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync-and-organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync LeetCode to Staging Zone
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'staging_zone'

      - name: Pull Action Commits and Re-organize
        run: |
          # The action commits directly to the remote repository. 
          # We must pull those automated commits first to avoid conflict failures.
          git pull origin master

          # Create the final target directories
          mkdir -p "sql/leetcode sql practice"
          mkdir -p "python/leetcode python practice"

          # Relocate SQL files
          find staging_zone -type f \( -name "*.sql" \) -exec mv {} "sql/leetcode sql practice/" \; 2>/dev/null || true

          # Relocate Python files
          find staging_zone -type f \( -name "*.py" \) -exec mv {} "python/leetcode python practice/" \; 2>/dev/null || true

          # Wipe out the staging_zone completely from Git tracking history
          git rm -rf staging_zone --ignore-unmatch
          rm -rf staging_zone

          # Configure Git credentials for pushing the layout adjustment
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage the moved folders and the deletion of staging_zone
          git add "sql/leetcode sql practice/" "python/leetcode python practice/"

          # Commit and push only if structural changes were made
          if ! git diff --cached --quiet; then
            git commit -m "Clean repo structure: route scripts from staging to specific languages"
            git push origin master
          else
            echo "Structure matches target architecture perfectly. No action needed."
          fi
