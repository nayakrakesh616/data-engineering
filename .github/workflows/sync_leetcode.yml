name: Sync LeetCode Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync-and-organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync LeetCode to Staging Zone
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'staging_zone'

      - name: Pull Remote Changes and Route Files
        run: |
          # 1. Pull the automated commit made by the leetcode-sync action
          git pull origin master --rebase

          # 2. Create the target directories if they don't exist
          mkdir -p "sql/leetcode sql practice"
          mkdir -p "python/leetcode python practice"

          # 3. If staging_zone exists, organize files by type
          if [ -d "staging_zone" ]; then
            echo "Sorting files into target folders..."
            
            # Move Python folders/files
            find staging_zone -type f \( -name "*.py" \) | while read -r file; do
              parent_dir=$(basename "$(dirname "$file")")
              mkdir -p "python/leetcode python practice/$parent_dir"
              cp "$file" "python/leetcode python practice/$parent_dir/"
            done

            # Move SQL folders/files
            find staging_zone -type f \( -name "*.sql" -o -name "*.mysql" -o -name "*.mssql" \) | while read -r file; do
              parent_dir=$(basename "$(dirname "$file")")
              mkdir -p "sql/leetcode sql practice/$parent_dir"
              cp "$file" "sql/leetcode sql practice/$parent_dir/"
            done

            # 4. Completely purge the staging_zone folder out of git tracking history
            git rm -rf staging_zone --ignore-unmatch
            rm -rf staging_zone
          fi

      - name: Commit and Push to Master
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add "sql/leetcode sql practice/" "python/leetcode python practice/"

          if ! git diff --cached --quiet; then
            git commit -m "Automated reorganization of LeetCode practices"
            git push origin master
          else
            echo "Folders are already fully organized."
          fi
