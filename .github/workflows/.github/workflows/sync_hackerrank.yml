name: Sync HackerRank Submissions

on:
  workflow_dispatch: # Allows you to run it manually anytime
  schedule:
    - cron: '0 6 * * *' # Runs automatically every morning

jobs:
  pull-and-sort-hackerrank:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone HackerRank Solutions Repo
        run: |
          # Clone your secondary repository where the extension pushes files
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git temp_hr_repo

      - name: Distribute and Organize Files
        run: |
          # Ensure final structural paths exist
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

          if [ -d "temp_hr_repo/solutions" ]; then
            echo "Processing and distributing HackerRank solutions..."

            # Find and copy Python submissions
            find temp_hr_repo/solutions -type f \( -name "*.py" -o -name "*.py3" \) | while read -r file; do
              problem_name=$(basename "$(dirname "$file")")
              mkdir -p "python/hackerrank python practice/$problem_name"
              cp "$file" "python/hackerrank python practice/$problem_name/"
            done

            # Find and copy SQL submissions (.sql, .mysql)
            find temp_hr_repo/solutions -type f \( -name "*.sql" -o -name "*.mysql" \) | while read -r file; do
              problem_name=$(basename "$(dirname "$file")")
              mkdir -p "sql/hackerrank sql practice/$problem_name"
              cp "$file" "sql/hackerrank sql practice/$problem_name/"
            done
          else
            echo "No solutions directory found in the extension repository yet."
          fi

          # Clean up the temporary workspace folder
          rm -rf temp_hr_repo

      - name: Commit and Push to Master
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: HackerRank practices organized by domain folders"
            git push origin master
          else
            echo "Everything is already perfectly up to date!"
          fi
