name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: main_repo
          fetch-depth: 0

      - name: 2. Checkout HackerRank Solutions Repo
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/hackerrank-solutions'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: hr_files

      - name: 3. Process and Move Files
        run: |
          # Create target structural folders cleanly inside the main repo workspace
          mkdir -p "main_repo/sql/hackerrank sql practice"
          mkdir -p "main_repo/python/hackerrank python practice"

          if [ -d "hr_files/solutions" ]; then
            echo "Solutions directory found! Parsing all programming streams..."
            
            # --- PYTHON EXTRACTOR ---
            # Finds python scripts anywhere inside the root solutions tree
            find hr_files/solutions -type f \( -name "*.py" -o -name "*.py3" \) | while read -r file; do
              problem_folder=$(basename "$(dirname "$file")")
              target_dir="main_repo/python/hackerrank python practice/$problem_folder"
              mkdir -p "$target_dir"
              cp "$file" "$target_dir/"
            done
            
            # --- MULTI-DIALECT SQL EXTRACTOR ---
            # Scans every folder path containing sql, mysql, mssql, oracle, or plsql keywords
            find hr_files/solutions -type f | while read -r file; do
              # Convert the full file path to lowercase to test dialects safely
              lowercase_path=$(echo "$file" | tr '[:upper:]' '[:lower:]')
              
              if [[ "$lowercase_path" == *"/sql/"* || "$lowercase_path" == *"/mysql/"* || "$lowercase_path" == *"/mssql/"* || "$lowercase_path" == *"/oracle/"* || "$lowercase_path" == *"/plsql/"* ]]; then
                # Exclude system metadata files like README templates
                if [[ "$(basename "$file")" != "README.md" ]]; then
                  problem_folder=$(basename "$(dirname "$file")")
                  target_dir="main_repo/sql/hackerrank sql practice/$problem_folder"
                  mkdir -p "$target_dir"
                  
                  echo "Routing SQL Dialect Solution [$(basename "$file")] into: $problem_folder"
                  cp "$file" "$target_dir/"
                fi
              fi
            done
          else
            echo "No files found in the source solutions repository path yet."
          fi

      - name: 4. Deploy Structural Updates to Master Branch
        run: |
          cd main_repo
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stage the newly populated practice folders
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          # Check changes and push to master branch safely
          if ! git diff --cached --quiet; then
            echo "New files detected! Committing to master branch..."
            git commit -m "Automated Sync: HackerRank practices organized by domain folders (All SQL Dialects Enabled)"
            git push origin master
          else
            echo "Everything is already perfectly up to date!"
          fi
