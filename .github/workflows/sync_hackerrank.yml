name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout HackerRank Solutions Repo
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/hackerrank-solutions'
          ref: main
          token: ${{ secrets.REPO_SYNC_TOKEN }} # Authenticates using your master secret key
          path: hr_files

      - name: 2. Process, Clean Headers, and Commit via GitHub API
        shell: python
        run: |
          import os
          import base64
          import urllib.request
          import json
          from pathlib import Path

          # Use your master secret token to guarantee authorization pass rules
          token = "${{ secrets.REPO_SYNC_TOKEN }}"
          repo = os.environ.get('GITHUB_REPOSITORY')
          
          def clean_file_content(source_path):
              """Reads the file and discards the metadata text injected at the top."""
              with open(source_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              
              cut_index = 0
              for idx, line in enumerate(lines[:20]):
                  clean_line = line.strip()
                  if any(k in clean_line for k in ['-- Link', '# Link', '-- Problem', '# Problem', 'Language', 'Subdomain', '-------', '=======']):
                      cut_index = idx + 1
              
              clean_lines = lines[cut_index:]
              while clean_lines and not clean_lines.strip():
                  clean_lines.pop(0)
              return "".join(clean_lines)

          def get_sha(repo_path):
              """Checks if the file already exists on master branch to get its tracking SHA hash."""
              url = f"https://api.github.com/repos/{repo}/contents/{repo_path}?ref=master"
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"token {token}")
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      return data.get("sha")
              except Exception:
                  return None

          def upload_to_github(repo_path, file_content):
              """Directly updates or creates files on the master branch via the GitHub Contents API."""
              sha = get_sha(repo_path)
              url = f"https://api.github.com/repos/{repo}/contents/{repo_path}"
              
              payload = {
                  "message": f"Automated Sync: Cleaned solution uploaded for {Path(repo_path).name}",
                  "content": base64.b64encode(file_content.encode('utf-8')).decode('utf-8'),
                  "branch": "master"
              }
              if sha:
                  payload["sha"] = sha

              req = urllib.request.Request(url, method="PUT")
              req.add_header("Authorization", f"token {token}")
              req.add_header("Content-Type", "application/json")
              
              try:
                  with urllib.request.urlopen(req, data=json.dumps(payload).encode('utf-8')) as response:
                      print(f"Successfully deployed: {repo_path}")
              except Exception as e:
                  print(f"Failed to deploy {repo_path}: {e}")

          source_dir = Path("hr_files")
          ignored_path_parts = {'solutions', 'easy', 'medium', 'hard', 'oracle', 'mysql', 'mssql', 'sql', 'python', 'python3', 'hr_files'}

          if source_dir.exists():
              for file_path in source_dir.rglob("*"):
                  if file_path.is_file() and not any(part.startswith('.') for part in file_path.parts):
                      if file_path.name == "README.md":
                          continue
                          
                      problem_folder = None
                      for part in reversed(file_path.parts[:-1]):
                          if part.lower() not in ignored_path_parts:
                              problem_folder = part
                              break
                              
                      if not problem_folder:
                          problem_folder = file_path.parent.name
                          
                      lowercase_path = str(file_path).lower()
                      pure_content = clean_file_content(file_path)
                      
                      # Identify and process Python scripts
                      if file_path.suffix in ['.py', '.py3'] or 'python' in lowercase_path:
                          target_repo_path = f"python/hackerrank python practice/{problem_folder}/{file_path.name}"
                          print(f"Processing Python: {file_path.name}")
                          upload_to_github(target_repo_path, pure_content)
                          
                      # Identify and process all SQL dialect scripts (MySQL, Oracle, PL/SQL, etc.)
                      elif file_path.suffix in ['.sql', '.mysql', '.mssql', '.oracle'] or any(d in lowercase_path for d in ['sql', 'mysql', 'mssql', 'oracle', 'plsql']):
                          target_repo_path = f"sql/hackerrank sql practice/{problem_folder}/{file_path.name}"
                          print(f"Processing SQL Dialect: {file_path.name}")
                          upload_to_github(target_repo_path, pure_content)
