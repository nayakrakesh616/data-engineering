name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  pull-and-sort-hackerrank:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run Sync Engine
        run: |
          # 1. Create target structural folders cleanly
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

          # 2. Clone the public submissions repo safely into a temp folder
          echo "Cloning hackerrank-solutions..."
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git temp_hr_repo || true

          # 3. If the cloned folder exists, migrate the contents safely
          if [ -d "temp_hr_repo" ]; then
            echo "Sorting files by language extensions..."
            
            # Copy Python files (.py), ignoring internal hidden metadata files
            find temp_hr_repo -type f -name "*.py" ! -path '*/.**' -exec cp {} "python/hackerrank python practice/" \; 2>/dev/null || true
            
            # Copy SQL files (.sql, .mysql)
            find temp_hr_repo -type f \( -name "*.sql" -o -name "*.mysql" \) ! -path '*/.**' -exec cp {} "sql/hackerrank sql practice/" \; 2>/dev/null || true
            
            # Remove temp clone directory
            rm -rf temp_hr_repo
          fi

          # 4. Stage changes safely
          git add python/ sql/ || true

          # 5. Commit and push inline using context flags to avoid environment config errors
          if ! git diff --cached --quiet; then
            echo "Changes detected, pushing updates..."
            git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "Automated Sync: HackerRank practices organized by domain folders"
            git push origin master
          else
            echo "Repository structure is completely up to date."
          fi
