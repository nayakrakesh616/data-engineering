name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  pull-and-sort-hackerrank:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run Sync Engine
        run: |
          # 1. Create target structural folders cleanly
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

          # 2. Clone the public submissions repo safely into a temp folder
          echo "Cloning hackerrank-solutions repository..."
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git temp_hr_repo

          # 3. Log files present in the cloned repository to track paths
          echo "=== Found Files in HackerRank Repository ==="
          find temp_hr_repo -type f ! -path '*/.*'
          echo "============================================"

          # 4. Migrate and route Python files (.py, .py3)
          find temp_hr_repo -type f \( -name "*.py" -o -name "*.py3" \) ! -path '*/.*' | while read -r file; do
            problem_name=$(basename "$(dirname "$file")")
            # If the parent directory is generic, fall back to the challenge name slug
            if [ "$problem_name" = "python" ] || [ "$problem_name" = "python3" ] || [ "$problem_name" = "easy" ] || [ "$problem_name" = "medium" ] || [ "$problem_name" = "hard" ]; then
              problem_name=$(basename "$file" | cut -d. -f1)
            fi
            echo "Routing Python challenge to: python/hackerrank python practice/$problem_name"
            mkdir -p "python/hackerrank python practice/$problem_name"
            cp "$file" "python/hackerrank python practice/$problem_name/"
          done

          # 5. Migrate and route SQL files (.sql, .mysql)
          find temp_hr_repo -type f \( -name "*.sql" -o -name "*.mysql" \) ! -path '*/.*' | while read -r file; do
            problem_name=$(basename "$(dirname "$file")")
            if [ "$problem_name" = "sql" ] || [ "$problem_name" = "easy" ] || [ "$problem_name" = "medium" ] || [ "$problem_name" = "hard" ]; then
              problem_name=$(basename "$file" | cut -d. -f1)
            fi
            echo "Routing SQL challenge to: sql/hackerrank sql practice/$problem_name"
            mkdir -p "sql/hackerrank sql practice/$problem_name"
            cp "$file" "sql/hackerrank sql practice/$problem_name/"
          done

          # Clean up local temporary cloning space
          rm -rf temp_hr_repo

          # 6. Stage and commit changes safely
          git add python/ sql/ || true

          if ! git diff --cached --quiet; then
            echo "New files detected, committing to master..."
            git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "Automated Sync: HackerRank practices organized by domain folders"
            git push origin master
          else
            echo "No new files or changes found to sync."
          fi
