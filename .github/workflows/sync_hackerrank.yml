name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 2. Clone HackerRank Solutions
        run: |
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git hr_files

      - name: 3. Organize Folder Structure
        run: |
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

      - name: 4. Move Submissions
        run: |
          # Copy Python files if any exist
          cp -r hr_files/*.py "python/hackerrank python practice/" 2>/dev/null || true
          cp -r hr_files/**/*.py "python/hackerrank python practice/" 2>/dev/null || true
          
          # Copy SQL files if any exist
          cp -r hr_files/*.sql "sql/hackerrank sql practice/" 2>/dev/null || true
          cp -r hr_files/**/*.sql "sql/hackerrank sql practice/" 2>/dev/null || true
          
          # Remove the temporary folder
          rm -rf hr_files

      - name: 5. Push Clean Structure
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Sync: HackerRank practices organized by domain folders"
          branch: master
