name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: main_repo
          fetch-depth: 0

      - name: 2. Checkout HackerRank Solutions Repo
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/hackerrank-solutions'
          ref: main # Target the extension's branch explicitly
          token: ${{ secrets.GITHUB_TOKEN }}
          path: hr_files

      - name: 3. Process, Strip Headers, and Route Files
        shell: python
        run: |
          import os
          from pathlib import Path

          sql_target = Path("main_repo/sql/hackerrank sql practice")
          py_target = Path("main_repo/python/hackerrank python practice")
          
          sql_target.mkdir(parents=True, exist_ok=True)
          py_target.mkdir(parents=True, exist_ok=True)

          def clean_file_content(source_path, dest_path):
              """Reads the file and discards the metadata text injected at the top."""
              with open(source_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              
              cut_index = 0
              # Look for the footer line of the header comments block
              for idx, line in enumerate(lines[:20]):
                  clean_line = line.strip()
                  if any(k in clean_line for k in ['-- Link', '# Link', '-- Problem', '# Problem', 'Language', 'Subdomain', '-------', '=======']):
                      cut_index = idx + 1
              
              clean_lines = lines[cut_index:]
              
              # Strip lingering top empty spaces
              while clean_lines and not clean_lines[0].strip():
                  clean_lines.pop(0)
                  
              with open(dest_path, 'w', encoding='utf-8') as f:
                  f.writelines(clean_lines)

          source_dir = Path("hr_files")
          # List of keywords to skip when searching for the true problem directory name
          ignored_path_parts = {'solutions', 'easy', 'medium', 'hard', 'oracle', 'mysql', 'mssql', 'sql', 'python', 'python3', 'hr_files'}

          if source_dir.exists():
              for file_path in source_dir.rglob("*"):
                  if file_path.is_file() and not any(part.startswith('.') for part in file_path.parts):
                      if file_path.name == "README.md":
                          continue
                          
                      # Determine the real challenge folder by filtering out system keyword paths
                      problem_folder = None
                      for part in reversed(file_path.parts[:-1]):
                          if part.lower() not in ignored_path_parts:
                              problem_folder = part
                              break
                              
                      if not problem_folder:
                          problem_folder = file_path.parent.name
                          
                      lowercase_path = str(file_path).lower()
                      
                      # File distribution logic
                      if file_path.suffix in ['.py', '.py3'] or 'python' in lowercase_path:
                          dest_dir = py_target / problem_folder
                          dest_dir.mkdir(parents=True, exist_ok=True)
                          print(f"Cleaning and processing Python file: {file_path.name} -> {problem_folder}")
                          clean_file_content(file_path, dest_dir / file_path.name)
                          
                      elif file_path.suffix in ['.sql', '.mysql', '.mssql', '.oracle'] or any(d in lowercase_path for d in ['sql', 'mysql', 'mssql', 'oracle', 'plsql']):
                          dest_dir = sql_target / problem_folder
                          dest_dir.mkdir(parents=True, exist_ok=True)
                          print(f"Cleaning and processing SQL Dialect file: {file_path.name} -> {problem_folder}")
                          clean_file_content(file_path, dest_dir / file_path.name)

      - name: 4. Deploy Clean Code Updates to Master Branch
        run: |
          cd main_repo
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          if ! git diff --cached --quiet; then
            echo "New solution assets found. Pushing up updates..."
            git commit -m "Automated Sync: HackerRank challenge solutions structured by topic folders"
            git push origin master
          else
            echo "All structural sync files are already up to date!"
          fi
