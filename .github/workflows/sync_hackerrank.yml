name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  pull-and-sort-hackerrank:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone Public HackerRank Solutions Repo
        run: |
          # Clones your repository into a temporary local runner directory
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git temp_hr_repo

      - name: Distribute and Organize Files
        run: |
          # Create target structural folders
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

          echo "Scanning cloned files..."
          
          # Sort and move Python scripts (.py)
          find temp_hr_repo -type f -name "*.py" | while read -r file; do
            filename=$(basename "$file")
            # Avoid copying internal git files
            if [[ "$file" != *".github"* ]]; then
              echo "Moving Python file: $filename"
              cp "$file" "python/hackerrank python practice/"
            fi
          done

          # Sort and move SQL scripts (.sql, .mysql)
          find temp_hr_repo -type f \( -name "*.sql" -o -name "*.mysql" \) | while read -r file; do
            filename=$(basename "$file")
            echo "Moving SQL file: $filename"
            cp "$file" "sql/hackerrank sql practice/"
          done

          # Clean up temporary cloned repository folder
          rm -rf temp_hr_repo

      - name: Commit and Push to Master
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: HackerRank practices organized by domain folders"
            git push origin master
          else
            echo "Everything is already perfectly up to date!"
          fi
