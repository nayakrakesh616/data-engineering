name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 2. Download and Sort Submissions
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          # Setup main repository targets
          sql_target = Path("sql/hackerrank sql practice")
          py_target = Path("python/hackerrank python practice")
          
          sql_target.mkdir(parents=True, exist_ok=True)
          py_target.mkdir(parents=True, exist_ok=True)

          # Safely clone the public helper repository using a standard terminal command
          print("Downloading solutions from helper repository...")
          repo_owner = os.environ.get('GITHUB_REPOSITORY_OWNER')
          clone_url = f"https://github.com{repo_owner}/hackerrank-solutions.git"
          subprocess.run(["git", "clone", "-b", "main", clone_url, "temp_hr_files"], check=True)

          def clean_file_content(source_path, dest_path):
              """Reads the file and discards the metadata text injected at the top."""
              with open(source_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              
              cut_index = 0
              for idx, line in enumerate(lines[:20]):
                  clean_line = line.strip()
                  if any(k in clean_line for k in ['-- Link', '# Link', '-- Problem', '# Problem', 'Language', 'Subdomain', '-------', '=======']):
                      cut_index = idx + 1
              
              clean_lines = lines[cut_index:]
              while clean_lines and not clean_lines.strip():
                  clean_lines.pop(0)
                  
              with open(dest_path, 'w', encoding='utf-8') as f:
                  f.writelines(clean_lines)

          source_dir = Path("temp_hr_files")
          ignored_path_parts = {'solutions', 'easy', 'medium', 'hard', 'oracle', 'mysql', 'mssql', 'sql', 'python', 'python3', 'temp_hr_files'}

          if source_dir.exists():
              for file_path in source_dir.rglob("*"):
                  if file_path.is_file() and not any(part.startswith('.') for part in file_path.parts):
                      if file_path.name == "README.md":
                          continue
                          
                      problem_folder = None
                      for part in reversed(file_path.parts[:-1]):
                          if part.lower() not in ignored_path_parts:
                              problem_folder = part
                              break
                              
                      if not problem_folder:
                          problem_folder = file_path.parent.name
                          
                      lowercase_path = str(file_path).lower()
                      
                      # Routing logic for Python files
                      if file_path.suffix in ['.py', '.py3'] or 'python' in lowercase_path:
                          dest_dir = py_target / problem_folder
                          dest_dir.mkdir(parents=True, exist_ok=True)
                          print(f"Syncing Python file: {file_path.name} -> {problem_folder}")
                          clean_file_content(file_path, dest_dir / file_path.name)
                          
                      # Routing logic for all SQL dialects (Oracle, MySQL, SQL Server, PL/SQL)
                      elif file_path.suffix in ['.sql', '.mysql', '.mssql', '.oracle'] or any(d in lowercase_path for d in ['sql', 'mysql', 'mssql', 'oracle', 'plsql']):
                          dest_dir = sql_target / problem_folder
                          dest_dir.mkdir(parents=True, exist_ok=True)
                          print(f"Syncing SQL file: {file_path.name} -> {problem_folder}")
                          clean_file_content(file_path, dest_dir / file_path.name)

          # Remove the temporary files path cleanly
          if os.path.exists("temp_hr_files"):
              subprocess.run(["rm", "-rf", "temp_hr_files"])

      - name: 3. Commit and Deploy Updates to Master Branch
        run: |
          # Configure commit profile
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stage the newly populated practice folders explicitly
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          # Check changes and push to master branch safely via token injection URL
          if ! git diff --cached --quiet; then
            echo "New pure files detected! Committing changes..."
            git commit -m "Automated Sync: HackerRank challenge solutions structured cleanly"
            
            # Use authenticated remote tracking URL to guarantee force pushing authorization
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git"
            git push origin master
          else
            echo "Everything is already perfectly up to date!"
          fi
