name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Process Submissions
        run: |
          # 1. Force clean the target directory structure
          mkdir -p "sql/hackerrank sql practice"
          mkdir -p "python/hackerrank python practice"

          # 2. Clone the public submissions repo (Removed '|| true' to see explicit errors)
          echo "Cloning hackerrank-solutions repository..."
          git clone https://github.com hr_files

          # 3. Verify if files exist and move them explicitly without subshell loops
          if [ -d "hr_files/solutions" ]; then
            echo "Solutions directory found! Copying files..."
            
            # Use standard find and copy directly to target folders
            find hr_files/solutions -type f \( -name "*.py" -o -name "*.py3" \) -exec cp {} "python/hackerrank python practice/" \; 2>/dev/null || true
            find hr_files/solutions -type f \( -name "*.sql" -o -name "*.mysql" \) -exec cp {} "sql/hackerrank sql practice/" \; 2>/dev/null || true
          else
            echo "Warning: solutions directory not found in the cloned repository layout."
          fi

          # Clean up the temp cloning directory
          rm -rf hr_files

      - name: Deploy Structural Updates
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stage the newly populated practice folders
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          # Check changes and push to master branch
          if ! git diff --cached --quiet; then
            echo "Changes detected! Committing to master..."
            git commit -m "Automated Sync: HackerRank practices organized by domain folders"
            git push origin master
          else
            echo "No new files were transferred. Repository is up to date."
          fi
