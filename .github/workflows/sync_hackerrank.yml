name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 2. Clone HackerRank Solutions
        run: |
          git clone https://github.com{{ github.repository_owner }}/hackerrank-solutions.git hr_files

      - name: 3. Process and Move Files via Python
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          # Setup primary targets directories
          sql_target = Path("sql/hackerrank sql practice")
          py_target = Path("python/hackerrank python practice")
          
          sql_target.mkdir(parents=True, exist_ok=True)
          py_target.mkdir(parents=True, exist_ok=True)

          source_dir = Path("hr_files")
          if source_dir.exists():
              # Recursively seek files
              for file_path in source_dir.rglob("*"):
                  if file_path.is_file() and not any(part.startswith('.') for part in file_path.parts):
                      # Identify Python files
                      if file_path.suffix in ['.py', '.py3']:
                          print(f"Routing Python solution: {file_path.name}")
                          shutil.copy(file_path, py_target / file_path.name)
                      
                      # Identify SQL files
                      elif file_path.suffix in ['.sql', '.mysql']:
                          print(f"Routing SQL solution: {file_path.name}")
                          shutil.copy(file_path, sql_target / file_path.name)

      - name: 4. Workspace Cleanup
        run: rm -rf hr_files

      - name: 5. Push Clean Structure
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Sync: HackerRank practices organized by domain folders"
          branch: master
