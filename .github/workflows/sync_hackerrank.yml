name: Sync HackerRank Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Data Engineering Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: main_repo
          fetch-depth: 0

      - name: 2. Checkout HackerRank Solutions Repo
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/hackerrank-solutions'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: hr_files

      - name: 3. Process and Move Files
        run: |
          # Create target structural folders cleanly inside the main repo workspace
          mkdir -p "main_repo/sql/hackerrank sql practice"
          mkdir -p "main_repo/python/hackerrank python practice"

          echo "Scanning all downloaded solutions..."
          
          # --- PYTHON EXTRACTOR ---
          # Look for any Python challenge code files inside the cloned repo
          find hr_files -type f \( -name "*.py" -o -name "*.py3" \) ! -path '*/.*' | while read -r file; do
            # Extract the actual challenge folder slug name (e.g., 'py-if-else')
            problem_folder=$(basename "$(dirname "$file")")
            target_dir="main_repo/python/hackerrank python practice/$problem_folder"
            
            mkdir -p "$target_dir"
            echo "Routing Python challenge to: python/hackerrank python practice/$problem_folder"
            cp "$file" "$target_dir/"
          done
          
          # --- MULTI-DIALECT SQL EXTRACTOR ---
          # Look for any SQL dialect challenge files inside the cloned repo
          find hr_files -type f \( -name "*.sql" -o -name "*.mysql" -o -name "*.mssql" -o -name "*.oracle" \) ! -path '*/.*' | while read -r file; do
            problem_folder=$(basename "$(dirname "$file")")
            target_dir="main_repo/sql/hackerrank sql practice/$problem_folder"
            
            mkdir -p "$target_dir"
            echo "Routing SQL challenge to: sql/hackerrank sql practice/$problem_folder"
            cp "$file" "$target_dir/"
          done

      - name: 4. Deploy Structural Updates to Master Branch
        run: |
          cd main_repo
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stage the newly populated practice folders
          git add "python/hackerrank python practice/" "sql/hackerrank sql practice/"

          # Check changes and push to master branch safely
          if ! git diff --cached --quiet; then
            echo "New files detected! Committing to master branch..."
            git commit -m "Automated Sync: HackerRank practices cleanly structured"
            git push origin master
          else
            echo "Everything is already perfectly up to date!"
          fi
